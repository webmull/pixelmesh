<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelMesh — Simulator</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: #0d0d0d;
  font-family: -apple-system, system-ui, sans-serif;
  color: #ccc;
}
#controls {
  padding: 10px 16px;
  background: #141414;
  border-bottom: 1px solid #222;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
#controls label { font-size: 12px; color: #666; }
#nInput {
  width: 56px;
  padding: 5px 8px;
  background: #1e1e1e;
  border: 1px solid #333;
  color: #eee;
  border-radius: 5px;
  font-size: 13px;
}
button {
  padding: 5px 14px;
  background: #222;
  color: #ddd;
  border: 1px solid #333;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  letter-spacing: 0.02em;
}
button:hover { background: #2a2a2a; border-color: #444; }
button.primary { background: #1a3a1a; border-color: #2a5a2a; color: #7ddf7d; }
button.primary:hover { background: #1e441e; }
button.danger  { background: #2a1a1a; border-color: #4a2a2a; color: #df7d7d; }
button.danger:hover  { background: #331e1e; }

#wsStatus {
  margin-left: auto;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid #333;
  color: #555;
  background: #1a1a1a;
  transition: all 0.3s;
}
#wsStatus.connected    { color: #5c5; border-color: #2a4a2a; background: #0e1f0e; }
#wsStatus.partial      { color: #ca4; border-color: #4a3a1a; background: #1a140a; }

#grid {
  position: relative;
  width: 100%;
  height: calc(100vh - 44px);
}
.cell {
  position: absolute;
  width: 110px;
  height: 110px;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: monospace;
  border: 1px solid #1e1e1e;
  background: #000;
  transition: none;
}
.cell .id {
  font-size: 26px;
  font-weight: 700;
  color: rgba(255,255,255,0.12);
  line-height: 1;
}
.cell.bright .id { color: rgba(0,0,0,0.4); }
.cell .label {
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.2);
  font-size: 9px;
  white-space: nowrap;
}
.cell .dot {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #333;
  transition: background 0.4s;
}
.cell.ws-open   .dot { background: #3a3; }
.cell.ws-closed .dot { background: #633; }
</style>
</head>
<body>
<div id="controls">
  <label>Devices</label>
  <input type="number" id="nInput" value="8" min="1" max="32">
  <button class="primary" onclick="start()">Start</button>
  <button class="danger"  onclick="stopSim()">Stop</button>
  <span id="wsStatus">idle</span>
</div>
<div id="grid"></div>

<script src="/public/sim.js?v=f06e985c284840408e31a5721990b5ab"></script>
</body>
</html>
