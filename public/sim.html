<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelMesh V2 — Simulator</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: #111;
  font-family: -apple-system, system-ui, sans-serif;
  color: #ddd;
}
#controls {
  padding: 12px 16px;
  background: #1a1a1a;
  border-bottom: 1px solid #2a2a2a;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
#controls label { font-size: 13px; color: #999; }
button {
  padding: 6px 14px;
  background: #333;
  color: #eee;
  border: 1px solid #444;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
button:hover { background: #444; }
#grid {
  position: relative;
  width: 100%;
  height: calc(100vh - 70px);
}
.cell {
  position: absolute;
  width: 120px;
  height: 120px;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-family: monospace;
  border: 1px solid #2a2a2a;
  background: #000;
  transition: none;
}
.cell .label {
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.3);
  font-size: 10px;
  white-space: nowrap;
}
.cell .id {
  font-size: 28px;
  font-weight: 700;
  color: rgba(255,255,255,0.15);
}
.cell.bright .id { color: rgba(0,0,0,0.5); }
#status { font-size: 12px; color: #666; padding: 0 16px 8px; }
</style>
</head>
<body>
<div id="controls">
  <label>Devices:</label>
  <input type="number" id="nInput" value="8" min="1" max="32"
         style="width:60px;padding:5px;background:#222;border:1px solid #444;color:#eee;border-radius:4px;">
  <button onclick="start()">Start</button>
  <button onclick="stopSim()">Stop</button>
  <span id="wsStatus" style="font-size:12px;color:#666;">disconnected</span>
</div>
<div id="status"></div>
<div id="grid"></div>

<script src="/public/sim.js?v=1"></script>
</body>
</html>
