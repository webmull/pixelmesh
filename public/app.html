<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>pixelmesh</title>

<style>
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  width: 100%;
  height: 100%;
  touch-action: manipulation;
  overscroll-behavior: none;
  user-select: none;
}

body {
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

/* ---- Blink screen (detection mode) ---- */
#blinkScreen {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0ms linear;
}

/* Small status pill — visible while loading/waiting */
#statusPill {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.4);
  font: 12px -apple-system, system-ui, sans-serif;
  padding: 6px 14px;
  border-radius: 999px;
  white-space: nowrap;
  pointer-events: none;
}

/* Waiting screen */
#waitingMsg {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 32px;
  pointer-events: none;
}
#waitingMsg .wm-headline {
  color: rgba(255,255,255,0.92);
  font: 600 32px -apple-system, system-ui, sans-serif;
  letter-spacing: -0.5px;
}
#waitingMsg .wm-sub {
  margin-top: 12px;
  color: rgba(255,255,255,0.35);
  font: 15px -apple-system, system-ui, sans-serif;
}
#waitingMsg .wm-divider {
  width: 32px;
  height: 1px;
  background: rgba(255,255,255,0.12);
  margin: 36px auto;
}
.wm-id {
  color: rgba(255,255,255,0.7);
  font: 500 14px -apple-system, system-ui, sans-serif;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
#crowdMsg {
  margin-top: 10px;
  color: rgba(255,255,255,0.3);
  font: 13px -apple-system, system-ui, sans-serif;
  min-height: 18px;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50%       { opacity: 1;   transform: scale(1.25); }
}
.wm-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #fff;
  animation: pulse-dot 2s ease-in-out infinite;
}

/* ---- Showtime screen (effects) ---- */
#showtime {
  position: fixed;
  inset: 0;
  display: none;
  background: #000;
}

#projectionCanvas,
#effectCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>

<!-- Detection mode: full-screen blink panel -->
<div id="blinkScreen">
  <div id="waitingMsg">
    <div class="wm-headline">Get ready</div>
    <div class="wm-sub">Hold your phone up when the show begins · Don't close this screen · Turn brightness to full</div>
    <div class="wm-divider"></div>
    <div class="wm-id"><span class="wm-dot"></span><span id="waitingId"></span></div>
    <div id="crowdMsg"></div>
  </div>
  <div id="statusPill">connecting…</div>
</div>

<!-- Showtime mode: effects -->
<div id="showtime">
  <canvas id="projectionCanvas"></canvas>
  <canvas id="effectCanvas"></canvas>
</div>

<script src="/public/app.js?v=f06e985c284840408e31a5721990b5ab"></script>
</body>
</html>
