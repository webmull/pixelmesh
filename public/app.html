<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               minimum-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>pixelmesh</title>
<link rel="icon" href="data:,">

<style>
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: manipulation;
  overscroll-behavior: none;
  user-select: none;
}

/* ---- Cards ---- */
/* All cards are fixed full-screen. setView() shows one at a time via
   inline style.display. The CSS here defines the "shown" display type
   so removing the inline style reveals the card correctly. */

#card-blink {
  position: fixed;
  inset: 0;
  background: #000;
  transition: background 0ms linear;
  /* display: block (default) */
}

#card-waiting {
  position: fixed;
  inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px 32px;
  gap: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: #000;
}

#card-located {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: #000;
  pointer-events: none;
}

#card-effects {
  position: fixed;
  inset: 0;
  background: #000;
  /* display: block (default) */
}

#card-game {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  touch-action: none;
}

/* Small status pill — hidden */
#statusPill {
  display: none;
}

/* ---- Located card ---- */
#positionCanvas { display: block; }
#positionLabel {
  color: rgba(255,255,255,0.35);
  font: 500 11px -apple-system, system-ui, sans-serif;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* ---- Waiting card content ---- */
.wm-headline {
  color: rgba(255,255,255,0.92);
  font: 600 28px -apple-system, system-ui, sans-serif;
  letter-spacing: -0.5px;
}
.wm-sub {
  margin-top: 10px;
  color: rgba(255,255,255,0.35);
  font: 13px -apple-system, system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.wm-divider {
  width: 70%;
  max-width: 280px;
  height: 1px;
  flex-shrink: 0;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.2) 30%, rgba(255,255,255,0.2) 70%, transparent);
  margin: 14px auto;
}
.wm-id {
  color: rgba(255,255,255,0.7);
  font: 500 14px -apple-system, system-ui, sans-serif;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
#crowdMsg {
  margin-top: 8px;
  color: rgba(255,255,255,0.3);
  font: 13px -apple-system, system-ui, sans-serif;
  min-height: 18px;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50%       { opacity: 1;   transform: scale(1.25); }
}
.wm-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #fff;
  animation: pulse-dot 2s ease-in-out infinite;
}

.wm-divider2 {
  width: 70%;
  max-width: 280px;
  height: 1px;
  flex-shrink: 0;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.2) 30%, rgba(255,255,255,0.2) 70%, transparent);
  margin: 14px auto;
}

#likeBtn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  -webkit-tap-highlight-color: transparent;
  pointer-events: auto;
  position: relative;
  z-index: 2;
}
#likeBtn:active { transform: scale(0.85); }
#likeBtn svg { display: block; }

@keyframes like-pop {
  0%   { transform: scale(1); }
  20%  { transform: scale(1.35); }
  100% { transform: scale(1); }
}
@keyframes like-pulse {
  0%, 100% { transform: scale(1); }
  50%       { transform: scale(1.15); }
}
#likeBtn { animation: like-pulse 1.6s ease-in-out infinite; }
#likeBtn.popped { animation: like-pop 0.3s ease forwards; }

#likeCount {
  margin-top: 10px;
  color: rgba(255,255,255,0.4);
  font: 13px -apple-system, system-ui, sans-serif;
  min-height: 18px;
}
#likeHint {
  margin-top: 6px;
  color: rgba(255,255,255,0.2);
  font: 12px -apple-system, system-ui, sans-serif;
}

.fly-like {
  position: fixed;
  pointer-events: none;
  width: 20px;
  height: 20px;
  animation: fly-up 1.8s ease-out forwards;
  z-index: 9999;
}

@keyframes fly-up {
  0%   { opacity: 0.9; transform: translateY(0)      translateX(0)        scale(1); }
  100% { opacity: 0;   transform: translateY(-120px) translateX(var(--dx)) scale(0.5); }
}

/* ---- Effects card ---- */
#projectionCanvas,
#effectCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* ---- Game card ---- */
#gameBugWrap {
  cursor: pointer;
  padding: 30px;
  -webkit-tap-highlight-color: transparent;
}
#gameBugWrap img {
  width: 130px;
  height: auto;
  pointer-events: none;
  display: block;
}
#gamePrompt {
  color: #fff;
  font: 700 28px -apple-system, system-ui, sans-serif;
  letter-spacing: 1px;
}
@keyframes bug-bounce {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-12px); }
}
#bugHappy img { animation: bug-bounce 0.6s ease-in-out infinite; }
#bugScared { display: none; }

#gameResult {
  color: rgba(255,255,255,0.8);
  font: 700 28px -apple-system, system-ui, sans-serif;
}

@keyframes cd-pop {
  0%   { opacity: 0; transform: scale(1.6); }
  15%  { opacity: 1; transform: scale(1);   }
  80%  { opacity: 1; transform: scale(1);   }
  100% { opacity: 0; transform: scale(0.7); }
}
#countdownText {
  display: none;
  font: 800 110px -apple-system, system-ui, sans-serif;
  color: #fff;
  letter-spacing: -4px;
  pointer-events: none;
}
#countdownText.pop {
  display: block;
  animation: cd-pop 1s ease forwards;
}

#gameProgress {
  position: fixed;
  top: max(16px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.7);
  font: 500 13px -apple-system, system-ui, sans-serif;
  padding: 5px 14px;
  border-radius: 20px;
  pointer-events: none;
  display: none;
  z-index: 200;
  white-space: nowrap;
}

#gameWinner {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  background: radial-gradient(ellipse at center, rgba(255,180,0,0.12) 0%, transparent 70%);
  border-radius: 24px;
  padding: 28px 36px 20px;
}
#gameWinnerLabel {
  color: rgba(255,195,0,0.75);
  font: 700 12px -apple-system, system-ui, sans-serif;
  letter-spacing: 3px;
  text-transform: uppercase;
}
#gameWinnerPhone {
  color: #ffd740;
  font: 800 48px -apple-system, system-ui, sans-serif;
  text-shadow: 0 0 32px rgba(255,200,0,0.45);
}
#gameWinnerTime {
  color: rgba(255,210,80,0.7);
  font: 600 20px -apple-system, system-ui, sans-serif;
}
@keyframes winner-pop {
  0%   { transform: scale(0.6); opacity: 0; }
  60%  { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1);   opacity: 1; }
}
#gameWinner.show { animation: winner-pop 0.4s ease forwards; }

/* Personal outcome banner — top of winner card */
#gameMyBanner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
}
#gameMyBannerLabel {
  font: 800 36px -apple-system, system-ui, sans-serif;
  letter-spacing: -0.5px;
  text-align: center;
}
#gameMyBannerTime {
  font: 500 18px -apple-system, system-ui, sans-serif;
  color: rgba(255,255,255,0.45);
  min-height: 22px;
}

/* Separator between personal result and winner info */
.winner-sep {
  width: 60px;
  height: 1px;
  background: rgba(255,255,255,0.12);
  margin: 4px 0;
}

/* Winner section at bottom */
#gameWinnerSection {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 100%;
}
</style>
</head>
<body>

<!-- Blink card: background colour only (idle / detection flash / red missed flash) -->
<div id="card-blink" style="display:none"></div>

<!-- Waiting card: "Get ready" -->
<div id="card-waiting" style="display:none">
  <div class="wm-headline">Get ready</div>
  <div class="wm-sub">
    <span>Point your screen at the stage when the show starts</span>
    <span>Brightness to full · Turn off auto-lock</span>
  </div>
  <div class="wm-divider"></div>
  <div class="wm-id"><span class="wm-dot"></span><span id="waitingId"></span></div>
  <div id="crowdMsg"></div>
  <div class="wm-divider2"></div>
  <button id="likeBtn" aria-label="Send a like">
    <svg width="56" height="56" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path fill="#ffffff" d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/>
    </svg>
  </button>
  <div id="likeCount"></div>
  <div id="likeHint">tap to like</div>
  <div id="statusPill"></div>
</div>

<!-- Located card: position confirmed map -->
<div id="card-located" style="display:none">
  <canvas id="positionCanvas"></canvas>
  <div id="positionLabel">Located</div>
</div>

<!-- Effects card: showtime -->
<div id="card-effects" style="display:none">
  <canvas id="projectionCanvas"></canvas>
  <canvas id="effectCanvas"></canvas>
</div>

<!-- Game progress pill — floats above all cards -->
<div id="gameProgress"></div>

<!-- Game card: countdown / bug / winner -->
<div id="card-game" style="display:none">
  <div id="countdownText"></div>
  <div id="gameBugWrap">
    <div id="bugHappy">
      <img src="/public/assets/bug_happy.svg" alt="" draggable="false">
    </div>
    <div id="bugScared">
      <img src="/public/assets/bug_scared.svg" alt="" draggable="false">
    </div>
    <div id="gamePrompt">TAP!</div>
  </div>
  <div id="gameResult"></div>
  <div id="gameWinner">
    <!-- Personal outcome — prominent, shown at top -->
    <div id="gameMyBanner">
      <div id="gameMyBannerLabel"></div>
      <div id="gameMyBannerTime"></div>
    </div>
    <!-- Separator -->
    <div class="winner-sep"></div>
    <!-- Winner announcement -->
    <div id="gameWinnerSection">
      <div id="gameWinnerLabel">Winner</div>
      <div id="gameWinnerPhone"></div>
      <div id="gameWinnerTime"></div>
    </div>
  </div>
</div>

<script src="/public/app.js?v=__CACHE_BUST__"></script>
</body>
</html>
