<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>pixelmesh</title>
<link rel="icon" href="data:,">

<style>
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  width: 100%;
  height: 100%;
  touch-action: manipulation;
  overscroll-behavior: none;
  user-select: none;
}

body {
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

/* ---- Blink screen (detection mode) ---- */
#blinkScreen {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0ms linear;
}

/* Small status pill — hidden */
#statusPill {
  display: none;
}

/* Waiting screen */
#waitingMsg {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px 32px;
  pointer-events: none;
  gap: 0;
}
#waitingMsg .wm-headline {
  color: rgba(255,255,255,0.92);
  font: 600 28px -apple-system, system-ui, sans-serif;
  letter-spacing: -0.5px;
}
#waitingMsg .wm-sub {
  margin-top: 10px;
  color: rgba(255,255,255,0.35);
  font: 13px -apple-system, system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
#waitingMsg .wm-divider {
  width: 70%;
  max-width: 280px;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.2) 30%, rgba(255,255,255,0.2) 70%, transparent);
  margin: 18px auto;
}
.wm-id {
  color: rgba(255,255,255,0.7);
  font: 500 14px -apple-system, system-ui, sans-serif;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
#crowdMsg {
  margin-top: 8px;
  color: rgba(255,255,255,0.3);
  font: 13px -apple-system, system-ui, sans-serif;
  min-height: 18px;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50%       { opacity: 1;   transform: scale(1.25); }
}
.wm-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #fff;
  animation: pulse-dot 2s ease-in-out infinite;
}

.wm-divider2 {
  width: 70%;
  max-width: 280px;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.2) 30%, rgba(255,255,255,0.2) 70%, transparent);
  margin: 20px auto;
}

#likeBtn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  -webkit-tap-highlight-color: transparent;
  pointer-events: auto;
  position: relative;
  z-index: 2;
}
#likeBtn:active { transform: scale(0.85); }
#likeBtn svg { display: block; }

@keyframes like-pop {
  0%   { transform: scale(1); }
  20%  { transform: scale(1.35); }
  100% { transform: scale(1); }
}
@keyframes like-pulse {
  0%, 100% { transform: scale(1); }
  50%       { transform: scale(1.15); }
}
#likeBtn { animation: like-pulse 1.6s ease-in-out infinite; }
#likeBtn.popped { animation: like-pop 0.3s ease forwards; }

#likeCount {
  margin-top: 10px;
  color: rgba(255,255,255,0.4);
  font: 13px -apple-system, system-ui, sans-serif;
  min-height: 18px;
}
#likeHint {
  margin-top: 6px;
  color: rgba(255,255,255,0.2);
  font: 12px -apple-system, system-ui, sans-serif;
}

.fly-like {
  position: fixed;
  pointer-events: none;
  width: 36px;
  height: 36px;
  animation: fly-up 2.8s ease-out forwards;
  z-index: 1;
}

@keyframes fly-up {
  0%   { opacity: 1; transform: translateY(0)      translateX(0)        scale(1); }
  70%  { opacity: 0.7; }
  100% { opacity: 0; transform: translateY(-380px) translateX(var(--dx)) scale(0.4); }
}

/* ---- Showtime screen (effects) ---- */
#showtime {
  position: fixed;
  inset: 0;
  display: none;
  background: #000;
}

#projectionCanvas,
#effectCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>

<!-- Detection mode: full-screen blink panel -->
<div id="blinkScreen">
  <div id="waitingMsg">
    <div class="wm-headline">Get ready</div>
    <div class="wm-sub">
      <span>Point your screen at the stage when the show starts</span>
      <span>Brightness to full · Turn off auto-lock</span>
    </div>
    <div class="wm-divider"></div>
    <div class="wm-id"><span class="wm-dot"></span><span id="waitingId"></span></div>
    <div id="crowdMsg"></div>
    <div class="wm-divider2"></div>
    <button id="likeBtn" aria-label="Send a like">
      <svg width="56" height="56" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path fill="#ffffff" d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/>
      </svg>
    </button>
    <div id="likeCount"></div>
    <div id="likeHint">tap to like</div>
  </div>
  <div id="statusPill">connecting…</div>
</div>

<!-- Showtime mode: effects -->
<div id="showtime">
  <canvas id="projectionCanvas"></canvas>
  <canvas id="effectCanvas"></canvas>
</div>

<script src="/public/app.js?v=f06e985c284840408e31a5721990b5ab"></script>
</body>
</html>
