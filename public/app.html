<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>pixelmesh</title>

<style>
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  width: 100%;
  height: 100%;
  touch-action: manipulation;
  overscroll-behavior: none;
  user-select: none;
}

body {
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

/* ---- Blink screen (detection mode) ---- */
#blinkScreen {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0ms linear;
}

/* Small status pill — hidden */
#statusPill {
  display: none;
}

/* Waiting screen */
#waitingMsg {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px 32px;
  pointer-events: none;
  gap: 0;
}
#waitingMsg .wm-headline {
  color: rgba(255,255,255,0.92);
  font: 600 28px -apple-system, system-ui, sans-serif;
  letter-spacing: -0.5px;
}
#waitingMsg .wm-sub {
  margin-top: 10px;
  color: rgba(255,255,255,0.35);
  font: 14px -apple-system, system-ui, sans-serif;
}
#waitingMsg .wm-divider {
  width: 70%;
  max-width: 280px;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.2) 30%, rgba(255,255,255,0.2) 70%, transparent);
  margin: 24px auto;
}
.wm-id {
  color: rgba(255,255,255,0.7);
  font: 500 14px -apple-system, system-ui, sans-serif;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
#crowdMsg {
  margin-top: 8px;
  color: rgba(255,255,255,0.3);
  font: 13px -apple-system, system-ui, sans-serif;
  min-height: 18px;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50%       { opacity: 1;   transform: scale(1.25); }
}
.wm-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #fff;
  animation: pulse-dot 2s ease-in-out infinite;
}

.wm-divider2 {
  width: 70%;
  max-width: 280px;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.2) 30%, rgba(255,255,255,0.2) 70%, transparent);
  margin: 28px auto;
}

#heartBtn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s ease;
  pointer-events: auto;
  position: relative;
  z-index: 2;
}
#heartBtn:active { transform: scale(0.85); }
#heartBtn svg { display: block; }

@keyframes heart-pop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.3); }
  100% { transform: scale(1); }
}
#heartBtn.popped { animation: heart-pop 0.25s ease; }

#heartCount {
  margin-top: 10px;
  color: rgba(255,255,255,0.4);
  font: 13px -apple-system, system-ui, sans-serif;
  min-height: 18px;
}
#heartHint {
  margin-top: 6px;
  color: rgba(255,255,255,0.2);
  font: 12px -apple-system, system-ui, sans-serif;
}

.fly-heart {
  position: fixed;
  pointer-events: none;
  font-size: 36px;
  color: #ff2d6b;
  animation: fly-up 2.8s ease-out forwards;
  z-index: 1;
}

@keyframes fly-up {
  0%   { opacity: 1; transform: translateY(0)      translateX(0)        scale(1); }
  70%  { opacity: 0.7; }
  100% { opacity: 0; transform: translateY(-380px) translateX(var(--dx)) scale(0.4); }
}

/* ---- Showtime screen (effects) ---- */
#showtime {
  position: fixed;
  inset: 0;
  display: none;
  background: #000;
}

#projectionCanvas,
#effectCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>

<!-- Detection mode: full-screen blink panel -->
<div id="blinkScreen">
  <div id="waitingMsg">
    <div class="wm-headline">Get ready</div>
    <div class="wm-sub">Hold your phone up when the show begins · Don't close this screen · Turn brightness to full</div>
    <div class="wm-divider"></div>
    <div class="wm-id"><span class="wm-dot"></span><span id="waitingId"></span></div>
    <div id="crowdMsg"></div>
    <div class="wm-divider2"></div>
    <button id="heartBtn" aria-label="Send love">
      <svg width="84" height="76" viewBox="0 0 52 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M26 44S4 30 4 15.5A11.5 11.5 0 0 1 26 9.2 11.5 11.5 0 0 1 48 15.5C48 30 26 44 26 44Z"
              fill="#ff2d6b" stroke="none"/>
      </svg>
    </button>
    <div id="heartCount"></div>
    <div id="heartHint">tap to send love</div>
  </div>
  <div id="statusPill">connecting…</div>
</div>

<!-- Showtime mode: effects -->
<div id="showtime">
  <canvas id="projectionCanvas"></canvas>
  <canvas id="effectCanvas"></canvas>
</div>

<script src="/public/app.js?v=f06e985c284840408e31a5721990b5ab"></script>
</body>
</html>
