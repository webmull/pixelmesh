<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               minimum-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>pixelmesh</title>
<link rel="icon" href="data:,">

<style>
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: manipulation;
  overscroll-behavior: none;
  user-select: none;
}

/* ---- Cards ---- */
/* All cards are fixed full-screen. setView() shows one at a time via
   inline style.display. The CSS here defines the "shown" display type
   so removing the inline style reveals the card correctly. */

#card-blink {
  position: fixed;
  inset: 0;
  background: #000;
  transition: background 0ms linear;
  /* display: block (default) */
}

#card-waiting {
  position: fixed;
  inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px 32px;
  gap: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: #000;
}

#card-located {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: #000;
  pointer-events: none;
}

#card-effects {
  position: fixed;
  inset: 0;
  background: #000;
  /* display: block (default) */
}

#card-game {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: space-between;
  gap: 0;
  padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  touch-action: none;
}

/* Small status pill — hidden */
#statusPill {
  display: none;
}

/* ---- Located card ---- */
#positionCanvas { display: block; }
#positionLabel {
  color: rgba(255,255,255,0.5);
  font: 600 15px -apple-system, system-ui, sans-serif;
  letter-spacing: -0.2px;
  text-align: center;
}
#positionLabelSub {
  color: rgba(255,255,255,0.55);
  font: 400 12px -apple-system, system-ui, sans-serif;
  text-align: center;
}
#locatedPhoneId {
  margin-top: 6px;
  color: rgba(255,255,255,0.85);
  font: 600 14px -apple-system, system-ui, sans-serif;
  letter-spacing: 0.3px;
  text-align: center;
}
#locatedMsg {
  margin-top: 18px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#locatedMsg .lm-headline {
  color: rgba(255,255,255,0.85);
  font: 600 20px -apple-system, system-ui, sans-serif;
  letter-spacing: -0.3px;
}
#locatedMsg .lm-sub {
  color: rgba(255,255,255,0.55);
  font: 400 13px -apple-system, system-ui, sans-serif;
}

/* ---- Waiting card content ---- */
.wm-headline {
  color: rgba(255,255,255,0.92);
  font: 600 28px -apple-system, system-ui, sans-serif;
  letter-spacing: -0.5px;
}
.wm-sub {
  margin-top: 10px;
  color: rgba(255,255,255,0.55);
  font: 13px -apple-system, system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.wm-divider {
  width: 70%;
  max-width: 280px;
  height: 1px;
  flex-shrink: 0;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.2) 30%, rgba(255,255,255,0.2) 70%, transparent);
  margin: 14px auto;
}
.wm-id {
  color: rgba(255,255,255,0.7);
  font: 500 14px -apple-system, system-ui, sans-serif;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
#crowdMsg {
  margin-top: 8px;
  color: rgba(255,255,255,0.55);
  font: 13px -apple-system, system-ui, sans-serif;
  min-height: 18px;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50%       { opacity: 1;   transform: scale(1.25); }
}
.wm-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #fff;
  animation: pulse-dot 2s ease-in-out infinite;
}

.wm-divider2 {
  width: 70%;
  max-width: 280px;
  height: 1px;
  flex-shrink: 0;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.2) 30%, rgba(255,255,255,0.2) 70%, transparent);
  margin: 14px auto;
}

#likeBtn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  -webkit-tap-highlight-color: transparent;
  pointer-events: auto;
  position: relative;
  z-index: 2;
}
#likeBtn:active { transform: scale(0.85); }
#likeBtn svg { display: block; }

@keyframes like-pop {
  0%   { transform: scale(1); }
  20%  { transform: scale(1.35); }
  100% { transform: scale(1); }
}
@keyframes like-pulse {
  0%, 100% { transform: scale(1); }
  50%       { transform: scale(1.15); }
}
#likeBtn { animation: like-pulse 1.6s ease-in-out infinite; }
#likeBtn.popped { animation: like-pop 0.3s ease forwards; }

#likeCount {
  margin-top: 10px;
  color: rgba(255,255,255,0.4);
  font: 13px -apple-system, system-ui, sans-serif;
  min-height: 18px;
}
#likeHint {
  margin-top: 6px;
  color: rgba(255,255,255,0.45);
  font: 12px -apple-system, system-ui, sans-serif;
}

.fly-like {
  position: fixed;
  pointer-events: none;
  width: 20px;
  height: 20px;
  animation: fly-up 1.8s ease-out forwards;
  z-index: 9999;
}

@keyframes fly-up {
  0%   { opacity: 0.9; transform: translateY(0)      translateX(0)        scale(1); }
  100% { opacity: 0;   transform: translateY(-120px) translateX(var(--dx)) scale(0.5); }
}

/* ---- Effects card ---- */
#projectionCanvas,
#effectCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* ---- Game card (rope climb) ---- */
#card-game {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  position: fixed;
}
#card-game.team-diana {
  background: radial-gradient(ellipse at center 30%, #1f7d3d 0%, #08361b 50%, #000 100%);
}
#card-game.team-rosie {
  background: radial-gradient(ellipse at center 30%, #b03660 0%, #401029 50%, #000 100%);
}
#card-game.team-neutral {
  background: radial-gradient(ellipse at center 30%, #303030 0%, #111 50%, #000 100%);
}
/* Header block — pinned top, centred text */
#ropeHeader {
  flex: 0 0 auto;
  text-align: center;
  pointer-events: none;
}
#ropeTeamName {
  color: #fff;
  font: 800 30px -apple-system, system-ui, sans-serif;
  letter-spacing: 0.3px;
  text-shadow: 0 2px 16px rgba(0,0,0,0.45);
}
#ropeTeamSub {
  color: rgba(255,255,255,0.55);
  font: 500 12px -apple-system, system-ui, sans-serif;
  margin-top: 6px;
  letter-spacing: 1.6px;
  text-transform: uppercase;
}
/* Tap zone — takes the middle of the card, centred, with a big circular button */
#ropeTapZone {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;        /* allow shrink on small screens */
}
#ropePrompt {
  width: min(72vw, 320px);
  height: min(72vw, 320px);
  border-radius: 50%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 35% 30%,
              rgba(255,255,255,0.20) 0%,
              rgba(255,255,255,0.05) 55%,
              rgba(255,255,255,0.0) 100%);
  border: 2px solid rgba(255,255,255,0.16);
  box-shadow:
    inset 0 0 40px rgba(255,255,255,0.06),
    0 0 80px rgba(255,255,255,0.08);
  pointer-events: none;
  transition: transform 90ms ease-out, opacity 90ms ease-out,
              box-shadow 200ms ease-out;
  animation: rope-breathe 2.4s ease-in-out infinite;
}
/* Tap-icon glyph (slice of climb.png) lives as a background inside the
   round button — sized so the finger cleanly fills ~55% of the circle.  */
#ropePrompt::before {
  content: "";
  position: absolute;
  inset: 22%;
  background: url("/public/assets/climb.png") no-repeat;
  /* Sheet 1536×1024, tap_button slice (532, 836, 145, 145).
     Display the slice scaled to fill ::before:
       bg-size = sheet/slice × 100%
       bg-position = slice_xy / (sheet - slice) × 100% */
  background-size: 1059.31% 706.21%;
  background-position: 38.25% 95.11%;
  filter: drop-shadow(0 4px 14px rgba(0,0,0,0.4));
  image-rendering: pixelated;
}
@keyframes rope-breathe {
  0%, 100% { transform: scale(1.00); }
  50%      { transform: scale(1.03); }
}
#card-game.tapping #ropePrompt {
  transform: scale(0.93);
  opacity: 0.92;
  animation: none;
  box-shadow:
    inset 0 0 60px rgba(255,255,255,0.10),
    0 0 100px rgba(255,255,255,0.20);
}
/* On every accepted tap, this halo expands outward and fades.  Driven
   by an added/removed .pinging class from JS. */
#ropePrompt::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.6);
  opacity: 0;
  pointer-events: none;
}
#card-game.pinging #ropePrompt::after {
  animation: rope-ping 480ms ease-out;
}
@keyframes rope-ping {
  0%   { transform: scale(1);    opacity: 0.55; border-width: 3px; }
  100% { transform: scale(1.45); opacity: 0;    border-width: 1px; }
}
/* Spectator (uncalibrated) — replace the tap button with a quiet badge */
#card-game.team-neutral #ropePrompt {
  width: auto;
  height: auto;
  border: none;
  background: none;
  box-shadow: none;
  animation: none;
  font: 700 16px -apple-system, system-ui, sans-serif;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.45);
  text-transform: uppercase;
}
#card-game.team-neutral #ropePrompt::before,
#card-game.team-neutral #ropePrompt::after { content: none; display: none; }

/* Progress bars at the bottom of the card */
#ropeBars {
  flex: 0 0 auto;
  width: min(86vw, 360px);
  margin: 0 auto;
  pointer-events: none;
}
.rope-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 10px 0;
}
.rope-row .rope-name {
  width: 60px;
  text-align: right;
  font: 700 12px -apple-system, system-ui, sans-serif;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.rope-row .rope-name.diana { color: #6fdb96; }
.rope-row .rope-name.rosie { color: #f88aaa; }
.rope-bar {
  flex: 1;
  height: 14px;
  border-radius: 7px;
  background: rgba(255,255,255,0.08);
  overflow: hidden;
}
.rope-bar-fill {
  height: 100%;
  width: 0%;
  border-radius: 7px;
  transition: width 220ms linear;
}
.rope-bar-fill.diana { background: linear-gradient(90deg, #2d9148, #6fdb96); }
.rope-bar-fill.rosie { background: linear-gradient(90deg, #c34772, #f88aaa); }

#ropeWinner {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background: rgba(0,0,0,0.78);
  z-index: 10;
  pointer-events: none;
}
#ropeWinner.show { display: flex; }
#ropeWinnerHeader {
  color: rgba(255,255,255,0.45);
  font: 700 12px -apple-system, system-ui, sans-serif;
  letter-spacing: 4px;
  text-transform: uppercase;
}
/* WINNER scroll/banner sprite from climb.png */
#ropeWinnerBanner {
  width: min(78vw, 320px);
  aspect-ratio: 480 / 188;
  background: url("/public/assets/climb.png") no-repeat;
  background-size: 320% 544.68%;
  background-position: 65.44% 100%;
  image-rendering: pixelated;
  filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
  animation: rope-banner-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}
@keyframes rope-banner-pop {
  0%   { transform: scale(0.4) rotate(-6deg); opacity: 0; }
  60%  { transform: scale(1.12) rotate(2deg); opacity: 1; }
  100% { transform: scale(1)   rotate(0);     opacity: 1; }
}
#ropeWinnerName {
  font: 900 36px -apple-system, system-ui, sans-serif;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  animation: rope-name-rise 0.5s ease-out 0.25s backwards;
}
@keyframes rope-name-rise {
  0%   { transform: translateY(20px); opacity: 0; }
  100% { transform: translateY(0);    opacity: 1; }
}
#ropeWinnerName.diana { color: #6fdb96; text-shadow: 0 0 30px rgba(110,219,150,0.55); }
#ropeWinnerName.rosie { color: #f88aaa; text-shadow: 0 0 30px rgba(248,138,170,0.55); }
#ropeWinnerName.draw  { color: #ffd740; text-shadow: 0 0 30px rgba(255,215,64,0.45); }
#ropeWinnerSub {
  color: rgba(255,255,255,0.55);
  font: 500 16px -apple-system, system-ui, sans-serif;
  animation: rope-name-rise 0.5s ease-out 0.45s backwards;
}
</style>
</head>
<body>

<!-- Blink card: background colour only (idle / detection flash / red missed flash) -->
<div id="card-blink" style="display:none"></div>

<!-- Waiting card: "Get ready" -->
<div id="card-waiting" style="display:none">
  <div class="wm-headline">Get ready</div>
  <div class="wm-sub">
    <span>Point your screen at the stage when the show starts</span>
    <span>Brightness to full · Turn off auto-lock</span>
  </div>
  <div class="wm-divider"></div>
  <div class="wm-id"><span class="wm-dot"></span><span id="waitingId"></span></div>
  <div id="crowdMsg"></div>
  <div class="wm-divider2"></div>
  <button id="likeBtn" aria-label="Send a like">
    <svg width="56" height="56" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path fill="#ffffff" d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/>
    </svg>
  </button>
  <div id="likeCount"></div>
  <div id="likeHint">tap to like</div>
  <div id="statusPill"></div>
</div>

<!-- Located card: position confirmed map -->
<div id="card-located" style="display:none">
  <canvas id="positionCanvas"></canvas>
  <div id="positionLabel">Found you!</div>
  <div id="positionLabelSub">Here's your position in the crowd</div>
  <div id="locatedPhoneId"></div>
  <div class="wm-divider"></div>
  <div id="locatedMsg">
    <div class="lm-headline">You're all set</div>
    <div class="lm-sub">Hold your screen up when the show begins</div>
    <div class="lm-sub" style="margin-top:10px; color:rgba(255,255,255,0.2)">Brightness to full · Turn off auto-lock</div>
  </div>
</div>

<!-- Effects card: showtime -->
<div id="card-effects" style="display:none">
  <canvas id="projectionCanvas"></canvas>
  <canvas id="effectCanvas"></canvas>
</div>

<!-- Game card: rope climb -->
<div id="card-game" style="display:none">
  <div id="ropeHeader">
    <div id="ropeTeamName">Team</div>
    <div id="ropeTeamSub">Tap as fast as you can</div>
  </div>
  <div id="ropeTapZone">
    <div id="ropePrompt"></div>
  </div>
  <div id="ropeBars">
    <div class="rope-row">
      <span class="rope-name diana">Diana</span>
      <div class="rope-bar"><div id="ropeBarDiana" class="rope-bar-fill diana"></div></div>
    </div>
    <div class="rope-row">
      <span class="rope-name rosie">Rosie</span>
      <div class="rope-bar"><div id="ropeBarRosie" class="rope-bar-fill rosie"></div></div>
    </div>
  </div>
  <div id="ropeWinner">
    <div id="ropeWinnerBanner"></div>
    <div id="ropeWinnerName"></div>
    <div id="ropeWinnerSub"></div>
  </div>
</div>

<script src="/public/app.js?v=__CACHE_BUST__"></script>
</body>
</html>
