<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelMesh V2</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, system-ui, sans-serif;
  background: #0a0a0a;
  color: #e0e0e0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px;
  gap: 24px;
  min-height: 100vh;
}
h1 { font-size: 1.8rem; font-weight: 300; letter-spacing: 0.1em; margin: 0; }
.stream-wrap {
  width: 100%;
  max-width: 960px;
  aspect-ratio: 16/9;
  background: #111;
  border: 1px solid #222;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
}
.stream-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.no-stream {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #444;
  font-size: 0.9rem;
}
.links {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
a {
  display: inline-block;
  padding: 10px 28px;
  background: #1a1a1a;
  color: #fff;
  text-decoration: none;
  border-radius: 8px;
  font-size: 0.95rem;
  border: 1px solid #2a2a2a;
  transition: background 0.15s;
}
a:hover { background: #2a2a2a; }
</style>
</head>
<body>
  <h1>PixelMesh V2</h1>

  <div class="stream-wrap">
    <div class="no-stream" id="no-stream">Controller not running</div>
    <img id="stream" src="" alt="Camera stream" style="display:none">
  </div>

  <div class="links">
    <a href="/">Open Client</a>
    <a href="/internal/sim">Open Simulator</a>
    <a href="/internal/feed/v1" target="_blank">Stream (direct)</a>
  </div>

  <script>
    const img = document.getElementById('stream');
    const placeholder = document.getElementById('no-stream');
    function startStream() {
      img.src = '/internal/feed/v1?' + Date.now();
      img.style.display = 'block';
      placeholder.style.display = 'none';
    }
    img.onerror = function() {
      img.style.display = 'none';
      placeholder.style.display = 'flex';
      setTimeout(startStream, 3000);
    };
    startStream();
  </script>
</body>
</html>
