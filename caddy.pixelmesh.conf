# pixelmesh local TLS front door.
#
# Only used for a local show, where a router (the Flint) resolves
# pixelmesh.show to this laptop and there is no internet in the room. The
# normal path is unaffected: ngrok still dials plain http on 16924.
#
# Why a proxy rather than uvicorn's --ssl-keyfile: the controller talks to the
# server over plain loopback (network.py), including the camera feed socket
# carrying ~220KB JPEGs, and ngrok dials plain http too. TLS on 16924 would
# break both and put the feed through a cipher for nothing. Terminating in
# front leaves server.py, network.py and ngrok.pixelmesh.yml untouched.
#
# Why Caddy rather than stunnel or socat: server.py's _is_local_request treats
# "loopback AND no forwarding headers" as proof a request came from this
# machine, and gates the sensitive /admin routes on it. A raw TCP forwarder
# adds no headers, so every audience phone would arrive looking local. Caddy's
# reverse_proxy sets X-Forwarded-For/Proto/Host, so phones coming through here
# are classed exactly like phones coming through ngrok, which is correct.

{
	admin off
	# No ACME from this process. The cert is issued out of band by certbot
	# over DNS-01, because at show time there is no internet to renew with.
	auto_https off
}

https://pixelmesh.show:443 {
	tls {env.PIXELMESH_CERT} {env.PIXELMESH_KEY}
	# WebSocket upgrades pass through reverse_proxy untouched, so /ws and
	# /admin/feed_ws need no special casing.
	reverse_proxy 127.0.0.1:{env.PIXELMESH_PORT}
}

# A phone that types the bare hostname lands on port 80. Without this it gets
# ERR_CONNECTION_REFUSED, which is what sent us down this road to begin with.
http://pixelmesh.show:80 {
	redir https://pixelmesh.show{uri} permanent
}
