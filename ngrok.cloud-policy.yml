# Traffic policy for the pixelmesh.show CLOUD ENDPOINT (ngrok dashboard:
# Universal Gateway -> Endpoints -> pixelmesh.show -> Traffic Policy).
# This file is the versioned copy; paste its contents into the dashboard
# whenever it changes.
#
# Behaviour: forward to the show agent's internal endpoint when the
# laptop tunnel is up; otherwise serve the holding page below. The page
# doubles as pre-show onboarding (keep open / brightness / how to hold)
# and probes the origin every 10s with fetch, reloading only when the
# response stops carrying the x-pixelmesh-holding marker header, so
# there is no per-cycle reload flash.
#
# Three states are covered:
#   1. Agent offline (tunnel not running): forward-internal fails ->
#      on_error: continue -> request-phase holding page.
#   2. Agent up but app closed (server.py not on :16924): the forward
#      "succeeds" and ngrok's upstream error (a 5xx) comes back through
#      the tunnel -> the on_http_response rule replaces it.
#   3. Everything up: the app streams through untouched.
# The two holding-page bodies are generated identical; keep them so.
#
# The wordmark is hotlinked from pixelmesh.live (img tags need no CORS).
# Fonts are NOT hotlinked: pixelmesh.live serves no
# Access-Control-Allow-Origin header, so cross-origin @font-face would
# be silently blocked. System sans is used instead.
on_http_request:
  - actions:
      - type: forward-internal
        config:
          url: https://pixelmesh-agent.internal
          on_error: continue
      - type: custom-response
        config:
          status_code: 200
          headers:
            content-type: text/html; charset=utf-8
            cache-control: no-store
            x-pixelmesh-holding: "1"
          body: |
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
              <title>pixelmesh</title>
              <link rel="icon" type="image/png" href="https://pixelmesh.live/public/favicon.png">
              <noscript><meta http-equiv="refresh" content="10"></noscript>
              <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body {
                  min-height: 100vh;
                  min-height: 100svh;
                  background: #020204;
                  color: #9fa3ad;
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  position: relative;
                  overflow: hidden;
                  padding: 2rem calc(1.4rem + env(safe-area-inset-right))
                           calc(2rem + env(safe-area-inset-bottom))
                           calc(1.4rem + env(safe-area-inset-left));
                }
                .grid-bg {
                  position: fixed;
                  inset: 0;
                  background:
                    repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 48px),
                    repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 48px);
                }
                .glow {
                  position: fixed;
                  inset: -30%;
                  background: radial-gradient(circle at 50% 45%, rgba(255,255,255,0.055), transparent 55%);
                  animation: breathe 6s ease-in-out infinite;
                }
                @keyframes breathe {
                  0%, 100% { opacity: 0.35; }
                  50% { opacity: 1; }
                }
                .wrap {
                  position: relative;
                  width: 100%;
                  max-width: 24rem;
                  text-align: center;
                }
                .wrap img {
                  width: min(230px, 58vw);
                  aspect-ratio: 710 / 145;
                  display: block;
                  margin: 0 auto 1.5rem auto;
                }
                h1 {
                  color: #ffffff;
                  font-size: 1.15rem;
                  font-weight: 600;
                  letter-spacing: 0.01em;
                }
                .steps {
                  margin-top: 1.5rem;
                  text-align: left;
                  background: rgba(255, 255, 255, 0.03);
                  border: 1px solid rgba(255, 255, 255, 0.09);
                  border-radius: 12px;
                  padding: 0.35rem 1.15rem;
                }
                .steps div {
                  display: flex;
                  gap: 0.85rem;
                  align-items: baseline;
                  padding: 0.8rem 0;
                  border-top: 1px solid rgba(255, 255, 255, 0.06);
                  font-size: 0.92rem;
                  line-height: 1.5;
                }
                .steps div:first-child { border-top: 0; }
                .steps b {
                  color: #ffffff;
                  font-weight: 600;
                  font-size: 0.8rem;
                }
                .check {
                  margin-top: 1.4rem;
                  font-size: 0.72rem;
                  letter-spacing: 0.14em;
                  text-transform: uppercase;
                  color: #5c606a;
                }
                .check b {
                  color: #9fa3ad;
                  font-weight: 500;
                }
              </style>
            </head>
            <body>
              <div class="grid-bg"></div>
              <div class="glow"></div>
              <div class="wrap">
                <img src="https://pixelmesh.live/public/pixelmesh_text.svg" alt="pixelmesh">
                <h1>The show has not yet begun</h1>
                <div class="steps">
                  <div><b>1</b><span>Keep this page open. It joins the show the moment it starts.</span></div>
                  <div><b>2</b><span>Screen brightness to full, auto-lock off.</span></div>
                  <div><b>3</b><span>When asked, hold your phone up with the screen facing the front.</span></div>
                </div>
                <p class="check">Checking again in <b id="count">10</b>s</p>
              </div>
              <script>
                var n = 10;
                var el = document.getElementById('count');
                setInterval(function () {
                  n -= 1;
                  if (n > 0) { el.textContent = n; return; }
                  el.textContent = 0;
                  n = 10;
                  fetch('/', { cache: 'no-store' }).then(function (r) {
                    if (r.ok && !r.headers.get('x-pixelmesh-holding')) {
                      location.reload();
                    }
                  }).catch(function () {});
                }, 1000);
              </script>
            </body>
            </html>

# Agent up but app down: ngrok's upstream error is a 5xx; swap it for
# the holding page (also covers app crashes mid-show, which is a
# better audience experience than a stack trace).
on_http_response:
  - expressions:
      - res.status_code >= 500
    actions:
    - type: custom-response
      config:
        status_code: 200
        headers:
          content-type: text/html; charset=utf-8
          cache-control: no-store
          x-pixelmesh-holding: "1"
        body: |
