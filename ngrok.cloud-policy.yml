# Traffic policy for the pixelmesh.show CLOUD ENDPOINT (ngrok dashboard:
# Universal Gateway -> Endpoints -> pixelmesh.show -> Traffic Policy).
# This file is the versioned copy; paste its contents into the dashboard
# whenever it changes.
#
# Behaviour: forward to the show agent's internal endpoint when the
# laptop tunnel is up; otherwise serve the holding page below. The page
# probes the origin every 10s with fetch and reloads only when the
# response stops carrying the x-pixelmesh-holding marker header, so
# there is no per-cycle reload flash.
#
# Three states are covered:
#   1. Agent offline (tunnel not running): forward-internal fails ->
#      on_error: continue -> request-phase holding page.
#   2. Agent up but app closed (server.py not on :8000): the forward
#      "succeeds" and ngrok's upstream error (a 5xx) comes back through
#      the tunnel -> the on_http_response rule replaces it.
#   3. Everything up: the app streams through untouched.
# The two holding-page bodies are generated identical; keep them so.
#
# The wordmark is hotlinked from pixelmesh.live (img tags need no CORS).
# Fonts are NOT hotlinked: pixelmesh.live serves no
# Access-Control-Allow-Origin header, so cross-origin @font-face would
# be silently blocked. System sans is used instead.
on_http_request:
  - actions:
      - type: forward-internal
        config:
          url: https://pixelmesh-agent.internal
          on_error: continue
      - type: custom-response
        config:
          status_code: 200
          headers:
            content-type: text/html; charset=utf-8
            cache-control: no-store
            x-pixelmesh-holding: "1"
          body: |
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>pixelmesh</title>
              <link rel="icon" type="image/png" href="https://pixelmesh.live/public/favicon.png">
              <noscript><meta http-equiv="refresh" content="10"></noscript>
              <style>
                html, body { height: 100%; }
                body {
                  margin: 0;
                  background: #020204;
                  color: #9fa3ad;
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  text-align: center;
                }
                .wrap { padding: 2rem; }
                .wrap img {
                  width: min(300px, 70vw);
                  /* Reserve the box before the SVG arrives so text never nudges */
                  aspect-ratio: 710 / 145;
                  display: block;
                  margin: 0 auto 2rem auto;
                }
                .msg {
                  color: #ffffff;
                  font-size: 1.05rem;
                  letter-spacing: 0.02em;
                  margin: 0;
                }
                .sub {
                  font-size: 0.85rem;
                  margin-top: 0.9rem;
                }
                .sub b {
                  color: #ffffff;
                  font-weight: 500;
                }
              </style>
            </head>
            <body>
              <div class="wrap">
                <img src="https://pixelmesh.live/public/pixelmesh_text.svg" alt="pixelmesh">
                <p class="msg">The show has not yet begun</p>
                <p class="sub">Keep this page open. Checking again in <b id="count">10</b>s</p>
              </div>
              <script>
                // Probe instead of reloading: the page only actually reloads when
                // the origin stops serving the holding page (the show is up), so
                // there is no flash every cycle.
                var n = 10;
                var el = document.getElementById('count');
                setInterval(function () {
                  n -= 1;
                  if (n > 0) { el.textContent = n; return; }
                  el.textContent = 0;
                  n = 10;
                  fetch('/', { cache: 'no-store' }).then(function (r) {
                    if (r.ok && !r.headers.get('x-pixelmesh-holding')) {
                      location.reload();
                    }
                  }).catch(function () {});
                }, 1000);
              </script>
            </body>
            </html>

# Agent up but app down: ngrok's upstream error is a 5xx; swap it for
# the holding page (also covers app crashes mid-show, which is a
# better audience experience than a stack trace).
on_http_response:
  - expressions:
      - res.status_code >= 500
    actions:
    - type: custom-response
      config:
        status_code: 200
        headers:
          content-type: text/html; charset=utf-8
          cache-control: no-store
          x-pixelmesh-holding: "1"
        body: |
          <!DOCTYPE html>
